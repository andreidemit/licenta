name: Deploy Ollama/Gemma analyst to Azure Container Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - Dockerfile.ollama
      - scripts/ollama-entrypoint.sh
      - .github/workflows/azure-llm.yml

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: q-learning-llm
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
  LLM_MODEL: ${{ vars.LLM_MODEL || 'gemma4:26b' }}

jobs:
  deploy:
    name: Build and deploy Ollama analyst
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Azure deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing ${name}. Add it as a GitHub secret or repository variable."
              missing=1
            fi
          done
          if [[ -z "${{ vars.AZURE_CONTAINER_REGISTRY }}" ]]; then
            echo "::error::Missing repository variable AZURE_CONTAINER_REGISTRY."
            missing=1
          fi
          if [[ -z "${{ vars.AZURE_RESOURCE_GROUP }}" ]]; then
            echo "::error::Missing repository variable AZURE_RESOURCE_GROUP."
            missing=1
          fi
          if [[ -z "${{ vars.AZURE_LLM_CONTAINER_APP_NAME }}" ]]; then
            echo "::error::Missing repository variable AZURE_LLM_CONTAINER_APP_NAME. Provision infra with enable_llm=true first."
            missing=1
          fi
          exit "$missing"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Show Azure account
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az account show --query "{name:name, tenantId:tenantId, subscriptionId:id}" --output table

      - name: Login to Azure Container Registry
        run: az acr login --name "${{ vars.AZURE_CONTAINER_REGISTRY }}"

      - name: Build and push Ollama image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build -f Dockerfile.ollama -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Configure Container App registry
        run: |
          az containerapp registry set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_LLM_CONTAINER_APP_NAME }}" \
            --server "${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io" \
            --identity system

      - name: Update LLM Container App image
        run: |
          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_LLM_CONTAINER_APP_NAME }}" \
            --image "${{ steps.image.outputs.image }}" \
            --min-replicas 0 \
            --max-replicas 1 \
            --set-env-vars \
              LLM_MODEL="${LLM_MODEL}" \
              OLLAMA_HOST=0.0.0.0:11434 \
              OLLAMA_MODELS=/root/.ollama

      - name: Show LLM app status
        shell: bash
        run: |
          az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_LLM_CONTAINER_APP_NAME }}" \
            --query "{name:name, provisioningState:properties.provisioningState, latestRevision:properties.latestRevisionName}" \
            --output table
