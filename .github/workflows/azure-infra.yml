name: Provision Azure infrastructure

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: Azure resource group name
        required: true
        default: rg-qlearning-lab
      location:
        description: Azure region
        required: true
        default: westeurope
      name_prefix:
        description: Short lowercase prefix for resource names
        required: true
        default: qlearning
      container_image:
        description: Initial backend image. Backend workflow will replace this after ACR push.
        required: true
        default: mcr.microsoft.com/azuredocs/containerapps-helloworld:latest
      enable_llm:
        description: Provision the optional internal Ollama/Gemma Container App
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      llm_image:
        description: Initial LLM image. The LLM workflow can replace this after ACR push.
        required: true
        default: ollama/ollama:latest
      llm_model:
        description: Ollama model tag used by the AI analyst
        required: true
        default: gemma4:26b
      llm_workload_profile_name:
        description: Container Apps workload profile for the LLM service
        required: true
        default: Consumption-GPU-NC24-A100

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  provision:
    name: Deploy Bicep infrastructure
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Azure OIDC configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing ${name}. Add it as a GitHub secret or repository variable."
              missing=1
            fi
          done
          echo "GitHub repository: ${GITHUB_REPOSITORY}"
          echo "GitHub ref: ${GITHUB_REF}"
          echo "Expected Azure federated credential subject: repo:${GITHUB_REPOSITORY}:ref:${GITHUB_REF}"
          echo "If azure/login fails with AADSTS errors, add this exact subject in Azure App Registration > Federated credentials."
          exit "$missing"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Show Azure account
        run: az account show --query "{name:name, tenantId:tenantId, subscriptionId:id}" --output table

      - name: Install Bicep
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az bicep install

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "${{ inputs.resource_group }}" \
            --location "${{ inputs.location }}"

      - name: Deploy infrastructure
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deployment_name="main"
          if ! outputs="$(
              az deployment group create \
                --name "$deployment_name" \
                --resource-group "${{ inputs.resource_group }}" \
                --template-file infra/main.bicep \
                --parameters \
                  location="${{ inputs.location }}" \
                  namePrefix="${{ inputs.name_prefix }}" \
                  containerImage="${{ inputs.container_image }}" \
                  enableLlm="${{ inputs.enable_llm }}" \
                  llmImage="${{ inputs.llm_image }}" \
                  llmModel="${{ inputs.llm_model }}" \
                  llmWorkloadProfileName="${{ inputs.llm_workload_profile_name }}" \
                --query properties.outputs \
                --output json
            )"; then
            echo "::error::Infrastructure deployment failed. Listing failed deployment operations."
            az deployment operation group list \
              --resource-group "${{ inputs.resource_group }}" \
              --name "$deployment_name" \
              --query "[?properties.provisioningState=='Failed'].{resource:properties.targetResource.resourceName,type:properties.targetResource.resourceType,message:properties.statusMessage.error.message}" \
              --output table || true
            exit 1
          fi
          echo "$outputs" > deployment-outputs.json
          echo "backend_url=$(jq -r '.backendUrl.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "acr_name=$(jq -r '.acrName.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$(jq -r '.acrLoginServer.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "container_app_name=$(jq -r '.containerAppName.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$(jq -r '.frontendUrl.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "llm_container_app_name=$(jq -r '.llmContainerAppName.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "llm_internal_url=$(jq -r '.llmInternalUrl.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "static_web_app_name=$(jq -r '.staticWebAppName.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "storage_account_name=$(jq -r '.storageAccountName.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"

      - name: Write deployment summary
        run: |
          {
            echo "## Azure infrastructure outputs"
            echo ""
            echo "| Output | Value |"
            echo "|---|---|"
            echo "| Backend URL | ${{ steps.deploy.outputs.backend_url }} |"
            echo "| ACR name | ${{ steps.deploy.outputs.acr_name }} |"
            echo "| ACR login server | ${{ steps.deploy.outputs.acr_login_server }} |"
            echo "| Container App | ${{ steps.deploy.outputs.container_app_name }} |"
            echo "| Frontend URL | ${{ steps.deploy.outputs.frontend_url }} |"
            echo "| LLM Container App | ${{ steps.deploy.outputs.llm_container_app_name }} |"
            echo "| LLM internal URL | ${{ steps.deploy.outputs.llm_internal_url }} |"
            echo "| Static Web App | ${{ steps.deploy.outputs.static_web_app_name }} |"
            echo "| Storage Account | ${{ steps.deploy.outputs.storage_account_name }} |"
            echo ""
            echo "Set these GitHub variables after the first run:"
            echo ""
            echo "- \`AZURE_RESOURCE_GROUP=${{ inputs.resource_group }}\`"
            echo "- \`AZURE_CONTAINER_APP_NAME=${{ steps.deploy.outputs.container_app_name }}\`"
            echo "- \`AZURE_CONTAINER_REGISTRY=${{ steps.deploy.outputs.acr_name }}\`"
            echo "- \`AZURE_STATIC_WEB_APP_NAME=${{ steps.deploy.outputs.static_web_app_name }}\`"
            echo "- \`VITE_API_URL=${{ steps.deploy.outputs.backend_url }}\`"
            if [[ "${{ inputs.enable_llm }}" == "true" ]]; then
              echo "- \`AZURE_LLM_CONTAINER_APP_NAME=${{ steps.deploy.outputs.llm_container_app_name }}\`"
              echo "- \`LLM_ENABLED=true\`"
              echo "- \`LLM_BASE_URL=${{ steps.deploy.outputs.llm_internal_url }}/v1\`"
              echo "- \`LLM_MODEL=${{ inputs.llm_model }}\`"
            else
              echo "- \`LLM_ENABLED=false\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
