<h2 id="problema-central%C4%83-a-roboticii-moderne">Problema centrală a roboticii moderne</h2>
<ul>
<li><img class="emoji" draggable="false" alt="🏭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3ed.svg" data-marp-twemoji=""/> <strong>Amazon Kiva</strong> — 200.000+ roboți autonomi în depozitele globale, reducând costurile de operare cu <strong>~40%</strong></li>
<li><img class="emoji" draggable="false" alt="🚗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f697.svg" data-marp-twemoji=""/> <strong>Tesla Autopilot / Waymo</strong> — vehicule care iau decizii în timp real în medii dinamice și imprevizibile</li>
<li><img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f680.svg" data-marp-twemoji=""/> <strong>NASA Perseverance</strong> — rover Marte care navighează terenuri necunoscute fără intervenție umană în timp real</li>
<li><img class="emoji" draggable="false" alt="🏥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3e5.svg" data-marp-twemoji=""/> <strong>Roboți medicali TUG</strong> — livrare autonomă în spitale, evitând obstacole și persoane în mișcare</li>
<li><img class="emoji" draggable="false" alt="🌾" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f33e.svg" data-marp-twemoji=""/> <strong>Agricultură de precizie</strong> — roboți autonomi care optimizează consumul energetic pe suprafețe mari</li>
</ul>
<h2 id="de-ce-q-learning">De ce Q-Learning?</h2>
<ul>
<li>Algoritm <strong>model-free</strong> — nu necesită cunoașterea prealabilă a mediului</li>
<li><strong>Convergent garantat</strong> pentru medii stohastice finite (Watkins &amp; Dayan, 1992)</li>
<li><strong>Interpretabil</strong> — Q-table poate fi inspectată și explicată, spre deosebire de rețele neurale</li>
<li>Potrivit pentru probleme cu <strong>spațiu de stări discret și recompense sparse</strong></li>
</ul>

<h2 id="agentul-mediul-%C8%99i-obiectivul">Agentul, mediul și obiectivul</h2>

<ul>
<li>Energia scade constant — agentul <strong>moare</strong> dacă ajunge la 0</li>
<li>Hrana este rară — doar <strong>5%</strong> din celule</li>

<h3 id="evolu%C8%9Bia-epsilon-episod-%E2%86%92-valoare">Evoluția epsilon (episod → valoare):</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Episod     0: ε = 1.000  ████████████████████ (exploatare maximă)
Episod   200: ε = 0.368  ███████▌             
Episod   500: ε = 0.082  █▋                   
Episod   900: ε = 0.011  ▏                    
Episod  1000: ε = 0.010  ▏                    (exploatare maximă)
</code></pre>
<h3 id="interpretare-practic%C4%83">Interpretare practică:</h3>
<ul>
<li><strong>Primele 200 episoade</strong> — agentul explorează haotic, acumulează experiență</li>
<li><strong>Episoade 200–600</strong> — tranziție graduală spre comportament mai deterministic</li>
<li><strong>Dupa episodul 900</strong> — aproape pur greedy, politica este consolidată</li>
</ul>
</section>

<h3 id="fluxul-de-date-per-pas">Fluxul de date per pas:</h3>
<ol>
<li><strong>Renderer</strong> desenează starea curentă</li>
<li><strong>Agent</strong> selectează acțiunea (ε-greedy din Q-table)</li>
<li><strong>Environment.try_move()</strong> procesează acțiunea → payload de tranziție</li>
<li><strong>Agent.apply_action_result()</strong> actualizează poziția și energia</li>
<li><strong>QLearning</strong> calculează actualizarea Bellman</li>
<li><strong>Trainer</strong> înregistrează statisticile episodului</li>
</ol>
</section>

<h2 id="harta-garantat-rezolvabil%C4%83-prin-bfs">Harta garantat rezolvabilă prin BFS</h2>
<h3 id="procesul-de-generare-seed-based-reproductibil">Procesul de generare (seed-based, reproductibil):</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">generate_grid</span>(<span class="hljs-params">seed: <span class="hljs-built_in">int</span>, rows: <span class="hljs-built_in">int</span>, cols: <span class="hljs-built_in">int</span></span>) -&gt; Grid:
    rng = np.random.default_rng(seed)
    grid = place_terrain(rng, densities={
        OBSTACLE: <span class="hljs-number">0.15</span>,  <span class="hljs-comment"># 15% din celule</span>
        MUD:      <span class="hljs-number">0.08</span>,  <span class="hljs-comment"># 8%</span>
        FOOD:     <span class="hljs-number">0.05</span>,  <span class="hljs-comment"># 5%</span>
        DANGER:   <span class="hljs-number">0.03</span>,  <span class="hljs-comment"># 3%</span>
    })
    <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> bfs_reachable(grid, start, target):
        <span class="hljs-keyword">return</span> generate_grid(seed + <span class="hljs-number">1</span>, rows, cols)  <span class="hljs-comment"># retry</span>
    <span class="hljs-keyword">return</span> grid
</code></pre>

<h2 id="adaptare-la-perturb%C4%83ri-%C3%AEn-timpul-antrenamentului">Adaptare la perturbări în timpul antrenamentului</h2>

<h3 id="protocolul-de-perturbare">Protocolul de perturbare:</h3>
<ul>
<li>Episoadele 0–500: mediu static, convergență normală</li>
<li><strong>Episodul 500:</strong> 30% din obstacole repoziționare aleatoare (BFS re-validat)</li>
<li>Episoadele 500–1500: continuare antrenament pe harta modificată</li>
</ul>

 -150 │█

<h2 id="impactul-%CE%B1-asupra-vitezei-%C8%99i-stabilit%C4%83%C8%9Bii-convergen%C8%9Bei">Impactul α asupra vitezei și stabilității convergenței</h2>
<p>Testat pe Scenariul C, 1500 episoade, seed=42 (rulare reală <code>--alpha-sensitivity</code>):</p>

<td>95%</td>
<td>97%</td>

<h3 id="interpretare-rezultat-surprinz%C4%83tor">Interpretare (rezultat surprinzător):</h3>
<ul>
<li><strong>α = 0.05</strong> <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> — Cel mai bun! Actualizări conservative → politică mai stabilă, drum mai scurt</li>
<li><strong>α = 0.1</strong> — Bun, dar drumul greedy este mai lung (38 vs 12 pași)</li>
<li><strong>α = 0.2</strong> — Similar cu α=0.1; actualizările agresive nu aduc avantaj pe acest mediu</li>
</ul>
<blockquote>
<p><strong>Concluzie:</strong> Pentru medii deterministe cu recompense dense, α mic (0.05) produce politici mai rafinate prin actualizări graduale. Valoarea convențională α=0.1 rămâne un default bun, dar sensibilitatea arată că optimul real depinde de topologia specifică a mediului.</p>
</blockquote>
<p><em>Graficul suprapus generat: <code>data/alpha_comparison_C_20_42.png</code></em></p>
<h3 id="interpretare">Interpretare:</h3>
<ul>
<li><strong>α = 0.05</strong> — Convergență lentă: actualizările sunt timide, necesită mai multe vizite</li>
<li><strong>α = 0.1</strong> <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> — <strong>Optim pentru acest domeniu:</strong> echilibru convergență/stabilitate</li>
<li><strong>α = 0.2</strong> — Convergență rapidă inițial, dar instabilitate din cauza suprascrierii</li>

<h1 id="aplica%C8%9Bii-reale-vehicule-autonome-%F0%9F%9A%97">Aplicații Reale: Vehicule Autonome <img class="emoji" draggable="false" alt="🚗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f697.svg" data-marp-twemoji=""/></h1>
<h2 id="last-mile-delivery-cu-energie-limitat%C4%83">Last-mile delivery cu energie limitată</h2>
<h3 id="contextul-industrial">Contextul industrial:</h3>
<ul>
<li><strong>Starship Technologies</strong> — 4 milioane livrări autonome în campusuri universitare (2024)</li>
<li><strong>Nuro R3</strong> — vehicul autonom pentru livrări urbane de ultimul kilometru</li>
<li>Problema critică: <strong>optimizarea traseului</strong> ținând cont de nivelul bateriei și stațiile de reîncărcare</li>
</ul>
<h3 id="analogia-cu-simularea-noastr%C4%83">Analogia cu simularea noastră:</h3>
<ul>
<li><strong>Mediul urban</strong> = grid cu obstacole dinamice (pietoni, mașini, construcții)</li>
<li><strong>Energia limitată</strong> = bateria EV — același mecanism de homeostazie</li>
<li><strong>Zonele de pericol</strong> = intersecții periculoase, zone cu vizibilitate scăzută</li>
<li><strong>Hrana</strong> = stații de reîncărcare rapide (DC fast charging)</li>
<li><strong>Politica duală</strong> (Scen. B) = comportamentul real: detour la stație de încărcare când bateria &lt; 20%</li>
</ul>
<h3 id="de-ce-q-learning-%C8%99i-nu-gps-clasic">De ce Q-Learning (și nu GPS clasic)?</h3>
<ul>
<li>GPS nu poate gestiona <strong>obstacole necunoscute în timp real</strong></li>
<li>Q-Learning se adaptează la <strong>blocaje neprevăzute</strong> fără replanificare centralizată</li>
<li>Funcționează și în zone cu <strong>conectivitate limitată</strong> (fără cloud constant)</li>
</ul>
</section>

<li>A* necesită <strong>harta completă</strong> — indisponibilă în dezastre</li>
<li>Q-Learning funcționează <strong>online</strong>, actualizând politica cu fiecare observație nouă</li>

<ul>

<h2 id="energy-harvesting-%C8%99i-navigare-adaptiv%C4%83">Energy harvesting și navigare adaptivă</h2>
<h3 id="contextul-iot-internet-of-things">Contextul IoT (Internet of Things):</h3>
<ul>
<li><strong>Miliarde de dispozitive IoT</strong> cu baterii limitate (senzori industriali, smart cities, wearables)</li>
<li><strong>Energy harvesting</strong> — dispozitive care colectează energie din mediu (solar, vibrații, RF)</li>
<li>Problema: <strong>când și cât</strong> să transmiți date vs. să economisești energie</li>
</ul>

<h1 id="limit%C4%83ri-%C8%99i-direc%C8%9Bii-viitoare-%F0%9F%94%AD">Limitări și Direcții Viitoare <img class="emoji" draggable="false" alt="🔭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f52d.svg" data-marp-twemoji=""/></h1>
<h2 id="ce-nu-a-fost-implementat-%C8%99i-de-ce-conteaz%C4%83">Ce nu a fost implementat și de ce contează</h2>
<h3 id="limit%C4%83ri-actuale">Limitări actuale:</h3>
<ul>
<li><strong>Agent unic</strong> — nu modelează interacțiuni multi-agent (Amazon Kiva are mii simultan)</li>
<li><strong>Grid static</strong> (Scen. A/B) — mediile reale sunt mai dinamice decât Scenariul C</li>
<li><strong>Spațiu de acțiuni limitat</strong> — doar 5 acțiuni; roboții reali au control continuu</li>
<li><strong>Fără zgomot stochastic</strong> — mediul este determinist; realitatea include senzori zgomotoși</li>
<li><strong>Fără transfer learning</strong> — politica unui seed nu se transferă la alt layout</li>
</ul>
<h3 id="direc%C8%9Bii-planificate-din-planmd">Direcții planificate (din <code>plan.md</code>):</h3>
<ol>
<li><strong>Export CSV + grafice Matplotlib</strong> — vizualizare convergență completă</li>
<li><strong>Ablation studies formale</strong> — α, γ, ε sistematic pe grid de hiperparametri</li>
<li><strong>Comparație formală tabular vs. DQN</strong> pe aceeași problemă</li>
<li><strong>Multi-agent extension</strong> — coordonare prin reward sharing</li>
<li><strong>Mediu stochastic</strong> — acțiuni cu probabilitate de eșec (slip probability)</li>
<li><strong>Transfer learning</strong> — pre-antrenament pe grid mic, fine-tuning pe grid mare</li>
<li><strong>Vizualizare 3D</strong> — reprezentare volumetrică a Q-table</li>
</ol>
<h3 id="perspectiv%C4%83-pe-termen-lung">Perspectivă pe termen lung:</h3>
<p>Extinderea la <strong>Proximal Policy Optimization (PPO)</strong> sau <strong>SAC</strong> pentru spații de acțiuni continue, menținând mecanismul de homeostazie energetică ca element de noutate.</p>
</section>

<h1 id="concluzii-principale-%E2%9C%85">Concluzii Principale <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></h1>
<h2 id="ce-am-demonstrat-%C3%AEn-aceast%C4%83-lucrare">Ce am demonstrat în această lucrare</h2>
<p><strong>1. Convergența Q-Learning cu homeostazie energetică</strong><br />
Agentul converge la politici cu <strong>100% / 98% / 97-98%</strong> success rate (Scenariile A/B/C) în ~900 episoade pe grid 20×20 seed=42. Evaluarea greedy finală: 34–38 pași, reward 83–97.</p>
<p><strong>2. Comportament emergent de supraviețuire</strong><br />
Fără programare explicită a food-seeking-ului, agentul descoperă <strong>din experiență</strong> că la energie critică (bucket=0) trebuie să prioritizeze hrana față de țintă — comportament non-trivial, interpretabil prin Q-table. Energie rămasă greedy: 84–86/100.</p>
<p><strong>3. Robustețe remarcabilă la perturbări de mediu</strong><br />
Scenariul C: relocarea a 30% din obstacole la ep. 500 NU produce regresie — success rate crește imediat de la 69% la 81% în 75 episoade, demonstrând <strong>transfer learning implicit</strong> din Q-table-ul acumulat.</p>
<p><strong>4. Interpretabilitate ca avantaj competitiv</strong><br />
Q-table-ul de 64KB poate fi <strong>inspectat, vizualizat și explicat</strong> complet — avantaj crucial față de DQN în contexte unde siguranța și auditabilitatea contează (medicină, aviație, industrie).</p>
<p><strong>5. Relevanță aplicativă directă</strong><br />
Modelul este direct aplicabil la: roboți de depozit (Amazon Kiva), vehicule autonome last-mile, drone SAR, roboți agricoli, roboți medicali TUG și rețele de senzori IoT cu energy harvesting.</p>
<blockquote>
<p><em>Această lucrare demonstrează că principii simple de Q-Learning, augmentate cu constrângeri energetice realiste, produc comportamente inteligente netriviale cu aplicabilitate industrială directă.</em></p>
</blockquote>
</section>
